spring.application.name=smart-farming-api
spring.config.import=optional:file:.env[.properties]
server.port=8080
server.address=0.0.0.0
spring.jackson.serialization.indent-output=true
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/rootwise?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
integrations.weather.api-key=${OPENWEATHER_API_KEY:}
integrations.weather.base-url=${OPENWEATHER_BASE_URL:https://api.openweathermap.org/data/2.5}
integrations.openai.api-key=${OPENAI_API_KEY:}
integrations.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
integrations.openai.model=${OPENAI_MODEL:gpt-4o-mini}
